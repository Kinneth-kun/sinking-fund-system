<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e2c07d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Staycation Savings">
<title>Staycation Savings Offline</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="side" id="side">
    <div class="brand">
      <span class="brand-mark">$</span>
      <div>
        <strong>Staycation</strong>
        <small>Savings Offline</small>
      </div>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="members">Members</button>
      <button data-view="payments">Payments</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="reports">Reports</button>
      <button data-view="backup">Backup</button>
    </nav>
    <div class="side-note">
      <span id="storageStatus">Saved on this device</span>
      <button type="button" id="installBtn" hidden>Install</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">=</button>
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSub">Runs from this phone, no PHP server required.</p>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<template id="dashboardTpl">
  <div class="stat-grid">
    <article class="stat"><span>Total Collected</span><strong data-stat="actual"></strong><small data-stat="expected"></small></article>
    <article class="stat"><span>Active Members</span><strong data-stat="members"></strong><small>Daily rate: PHP 5</small></article>
    <article class="stat"><span>Days Since Start</span><strong data-stat="days"></strong><small>Since Jan 1, 2026</small></article>
    <article class="stat"><span>This Month</span><strong data-stat="month"></strong><small data-stat="monthName"></small></article>
  </div>
  <div class="grid-2">
    <section class="panel">
      <div class="section-head"><h2>Top Payers</h2></div>
      <div id="topPayers" class="list"></div>
    </section>
    <section class="panel">
      <div class="section-head"><h2>Recent Payments</h2></div>
      <div id="recentPayments" class="list"></div>
    </section>
  </div>
  <section class="panel">
    <div class="section-head">
      <h2>Member Balances</h2>
      <input id="dashSearch" class="input slim" placeholder="Search member">
    </div>
    <div id="balanceList" class="cards"></div>
  </section>
</template>

<template id="membersTpl">
  <section class="panel">
    <div class="section-head">
      <h2>Members</h2>
      <button class="btn gold" id="addMemberBtn" type="button">Add Member</button>
    </div>
    <input id="memberSearch" class="input" placeholder="Search members">
    <div id="memberList" class="cards spaced"></div>
  </section>
</template>

<template id="paymentsTpl">
  <div class="grid-2">
    <section class="panel">
      <div class="section-head"><h2>Record Payment</h2></div>
      <form id="paymentForm" class="form">
        <label>Member<select id="payMember" class="input" required></select></label>
        <div id="payInfo" class="mini-panel"></div>
        <label>Amount (PHP)<input id="payAmount" class="input" type="number" min="5" step="5" required placeholder="35"></label>
        <div id="payPreview" class="muted"></div>
        <label>Payment Date<input id="payDate" class="input" type="date" required></label>
        <label>Notes<textarea id="payNotes" class="input" rows="3" placeholder="Optional"></textarea></label>
        <button class="btn gold" type="submit">Record Payment</button>
      </form>
    </section>
    <section class="panel">
      <div class="section-head"><h2>History</h2></div>
      <div id="paymentList" class="list"></div>
    </section>
  </div>
</template>

<template id="calendarTpl">
  <section class="panel">
    <div class="section-head">
      <h2>Calendar</h2>
      <div class="toolbar">
        <input id="calMonth" class="input slim" type="month">
        <select id="calMember" class="input slim"></select>
      </div>
    </div>
    <div id="calendarStats" class="stat-grid compact"></div>
    <div id="calendarGrid" class="calendar"></div>
  </section>
</template>

<template id="reportsTpl">
  <div class="stat-grid">
    <article class="stat"><span>Grand Total</span><strong data-report="grand"></strong><small data-report="rate"></small></article>
    <article class="stat"><span>Expected</span><strong data-report="expected"></strong><small>Based on active members</small></article>
    <article class="stat"><span>Deficit</span><strong data-report="deficit"></strong><small>Uncollected so far</small></article>
    <article class="stat"><span>Payments</span><strong data-report="payments"></strong><small>All records</small></article>
  </div>
  <section class="panel">
    <div class="section-head"><h2>Monthly Breakdown</h2></div>
    <div id="monthlyReport" class="list"></div>
  </section>
  <section class="panel">
    <div class="section-head"><h2>Full Member Report</h2></div>
    <div id="memberReport" class="cards"></div>
  </section>
</template>

<template id="backupTpl">
  <div class="grid-2">
    <section class="panel">
      <div class="section-head"><h2>Backup</h2></div>
      <p class="muted">Export a JSON backup and keep it somewhere safe. This standalone app stores data on this phone/browser.</p>
      <div class="actions">
        <button class="btn gold" id="exportBtn" type="button">Export Backup</button>
        <button class="btn" id="seedBtn" type="button">Load Sample Members</button>
      </div>
    </section>
    <section class="panel">
      <div class="section-head"><h2>Restore</h2></div>
      <p class="muted">Import replaces the current offline data on this device.</p>
      <input id="importFile" class="input" type="file" accept="application/json">
    </section>
  </div>
</template>

<dialog id="memberDialog">
  <form method="dialog" id="memberForm" class="dialog-card">
    <h2 id="memberDialogTitle">Add Member</h2>
    <input type="hidden" id="memberId">
    <label>Full Name<input id="memberName" class="input" required></label>
    <label>Nickname<input id="memberNick" class="input"></label>
    <label>Status<select id="memberStatus" class="input"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
    <div class="dialog-actions">
      <button class="btn" value="cancel" type="button" id="cancelMember">Cancel</button>
      <button class="btn gold" value="default" type="submit">Save</button>
    </div>
  </form>
</dialog>

<script src="./assets/app.js"></script>
</body>
</html>
